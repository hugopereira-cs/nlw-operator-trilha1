<!DOCTYPE html>
  <html lang="pt-Br">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>ClipMaker</title>
    </head>
    <body>
      <h1>ClipMaker</h1>
      <button id="upload_widget" class="cloudinary-button">Upload files</button>

      <script src="https://upload-widget.cloudinary.com/latest/global/all.js" type="text/javascript"></script>  

      <script type="text/javascript">  
        const app = {
          transcriptionURL: '',
          public_id: '',
          waitForTranscription: async () => {
            const maxAttempts = 30;
            const delay = 2000;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const url = `https://res.cloudinary.com/${config.cloudName}/raw/upload/v${Date.now()}/${app.public_id}.transcript`;
              
              try {
                console.log(`Tentativa ${attempt}/${maxAttempts}: Verificando transcrição...`);
                const response = await fetch(url);
                
                if (response.ok) {
                  app.transcriptionURL = url;
                  console.log('Transcrição encontrada!', url);
                  return true
                }
              } catch (error) {
                console.log(`Tentativa ${attempt} falhou:`, error.message); 
              }
              
              // Aguarda antes da próxima tentativa (exceto a última)
              if (attempt < maxAttempts) {
                await new Promise(resolve => setTimeout(resolve, delay));
              }
            }

            console.log('Transcrição não encontrada após todas as tentativas.');
            return false;
          },
          getTranscription: async () => {
            const response = await fetch(app.transcriptionURL);
            return response.text();
          },
          getViralMoment: async () => {
            const transcription = await app.getTranscription();
            const model = 'gemini-3-flash-preview';
            const endpointGemini = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;

            const prompt = `
Role: You are a professional video editor specializing in viral content.
Task: Analyze the transcription below and identify the most engaging, funny, or surprising segment.
Constraints:
1. Duration: Minimum 30 seconds, Maximum 60 seconds.
2. Format: Return ONLY the start and end string for Cloudinary. Format: so_<start_seconds>,eo_<end_seconds>
3. Examples: "so_10,eo_20" or "so_12.5,eo_45.2"
4. CRITICAL: Do not use markdown, do not use quotes, do not explain. Return ONLY the raw string.

Transcription:
${transcription}
`;

            // Construção do cabeçalho para enviar com método POST
            const headers = {
              'x-goog-api-key': 'AIzaSyDj1_HFzaPJAXbzzkKKZX6ff7f9ensDGrk',
              'Content-Type': 'application/json'
            }

            // Criando o contents para o body
            const contents = [
              {
                parts: [
                  {
                    text: prompt
                  }
                ]
              }
            ]

            // Enviando a requisição para o endpoint
            const response = await fetch(endpointGemini, {
              method: 'POST',
              headers: headers,
              body: JSON.stringify({ contents })
            })

            const data = await response.json();
            console.log({data})
          },

          getViralMomentTime: async() => {
            try {
              return app.getViralMoment()
            } catch(error) {
              console.log({ error })
            }
          }
        }

        const config = {
          cloudName: 'dhexhadqd', 
          uploadPreset: 'upload_hugop_nlw'
        }

        const myWidget = cloudinary.createUploadWidget(
          config,
          async (error, result) => {
            console.log('error: ', error);
            if (!error && result && result.event === "success") { 
              console.log('Done! Here is the image info: ', result.info); 
              app.public_id = result.info.public_id;

              try {
                const isReady = await app.waitForTranscription();
                if (!isReady) {
                  throw new Error('erro ao buscar transcrição'); // Se der algum erro na transcrição, para aqui
                }

                const viralMoment = await app.getViralMoment(); // precisa responder nesse formato: so_12.5,eo_45.2
              } catch(error) {
                console.log(error);
              }
            }
          }
        )

        document.getElementById("upload_widget").addEventListener("click", () => {
          myWidget.open();
          }, false);
      </script>

    </body>
</html>
