<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipMaker - Crie Clipes Virais com IA</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide-icons"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      --slate-900: #0f172a;
      --slate-500: #64748b;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --white: #ffffff;
    }
    body {
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-slate-100 flex flex-col min-h-screen">
  <header class="fixed top-4 left-1/2 -translate-x-1/2 w-[95%] max-w-7xl mx-auto z-10">
    <nav class="flex items-center justify-between py-3 px-6 bg-white/60 backdrop-blur-md rounded-xl border border-white/30 shadow-sm">
      <div class="flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-900"><path d="m10 7 5 3-5 3V7Z"/><path d="M12 22h-2a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h2"/><path d="M18 6h-2a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
        <span class="text-lg font-bold tracking-tight text-slate-900">ClipMaker</span>
      </div>
       <a href="https://github.com/hugopereira-cs" target="_blank" class="p-2 rounded-full hover:bg-slate-200/50 transition-colors duration-300">
         <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-github text-slate-900"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
      </a>
    </nav>
  </header>

  <main class="w-full max-w-7xl mx-auto px-4 pt-32 pb-24 flex-grow">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-24 items-center">
      <div class="space-y-6">
        <h1 class="text-5xl md:text-6xl font-bold text-slate-900 tracking-tighter">
          Crie clipes virais <span class="text-indigo-600">em um instante.</span>
        </h1>
        <p class="text-lg text-slate-500 leading-relaxed">
          Faça upload do seu vídeo, insira sua chave da API Gemini e deixe a nossa IA encontrar o momento perfeito para viralizar. Edição de vídeo inteligente ao seu alcance.
        </p>
        
        <div class="flex items-center gap-3">
          <input type="password" id="apiKey" placeholder="Sua chave de API Gemini" class="flex-1 h-12 px-4 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-600 focus:outline-none transition-shadow duration-300 shadow-sm">
          <button id="uploadWidget" class="group relative inline-flex items-center justify-center h-12 px-6 font-bold text-white bg-slate-900 rounded-lg shadow-sm hover:bg-slate-800 transition-all duration-300 hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900">
            <span class="absolute -inset-0.5 rounded-lg bg-gradient-to-r from-indigo-500 to-purple-500 opacity-0 group-hover:opacity-100 transition-opacity duration-300 blur-lg"></span>
            <span class="relative flex items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-upload-cloud"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>
              Escolher Vídeo
            </span>
          </button>
        </div>
      </div>

      <div class="aspect-video bg-white rounded-2xl shadow-xl shadow-slate-900/10 border border-slate-200/50 flex items-center justify-center overflow-hidden">
        <video id="video" class="w-full h-full object-cover" controls></video>
        <div id="placeholder" class="flex flex-col items-center justify-center text-center text-slate-500 p-8 space-y-4">
           <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-film text-slate-400"><path d="M4.5 4.5h15"/><path d="M4.5 9.5h15"/><path d="M4.5 14.5h15"/><path d="M19.5 4.5v15"/><path d="M4.5 19.5V4.5"/></svg>
          <p class="font-medium">Seu clipe viral aparecerá aqui.</p>
          <p id="status" class="text-sm text-slate-400"></p>
        </div>
      </div>
    </div>
  </main>
  
  <footer class="py-8 text-center text-sm text-slate-500">
    Desenvolvido com ❤️ por <a href="https://github.com/hugopereira-cs" target="_blank" class="font-medium text-slate-900 hover:text-indigo-600 transition-colors">hugopereira-cs</a>
  </footer>

  <script src="https://upload-widget.cloudinary.com/latest/global/all.js" type="text/javascript"></script>

  <script type="text/javascript">
    const el = {
      status: document.getElementById('status'),
      video: document.getElementById('video'),
      apiKey: document.getElementById('apiKey'),
      button: document.getElementById('uploadWidget'),
      placeholder: document.getElementById('placeholder')
    }

    // Inicialmente, esconde o vídeo e mostra o placeholder
    el.video.style.display = 'none';

    const app = {
      transcriptionURL: '',
      public_id: '',
      
      setStatus: (text) => {
        el.status.textContent = text;
        console.log(text);
      },

      waitForTranscription: async () => {
        const maxAttempts = 30;
        const delay = 2000;
        
        app.setStatus('Iniciando verificação de transcrição...');

        for (let attempt = 1; attempt <= maxAttempts; attempt++) {
          const url = `https://res.cloudinary.com/${config.cloudName}/raw/upload/v${Date.now()}/${app.public_id}.transcript`;
          
          app.setStatus('Aguardando transcrição...');
          
          try {
            const response = await fetch(url);
            
            if (response.ok) {
              app.transcriptionURL = url;
              app.setStatus('Transcrição encontrada com sucesso!');
              return true
            }
          } catch (error) {
             app.setStatus(`Falha na busca pela trancrição: ${error.message}`);
          }
          
          if (attempt < maxAttempts) {
            await new Promise(resolve => setTimeout(resolve, delay));
          }
        }
        
        app.setStatus('Transcrição não encontrada após todas as tentativas.');
        return false;
      },
      
      getTranscription: async () => {
        app.setStatus('Obtendo texto da transcrição...');
        const response = await fetch(app.transcriptionURL);
        const text = await response.text();
        app.setStatus('Texto obtido.');
        return text;
      },
      
      getViralMoment: async () => {
        const maxRetries = 3;
        const baseDelay = 2500;

        const transcription = await app.getTranscription();
        const model = 'gemini-2.5-flash';
        const endpointGemini = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;

        const prompt = `
          Role: Você é um editor de vídeo profissional especializado em conteúdo viral.
          Task: Analise a transcrição abaixo e identifique o trecho mais impactante, engraçado ou surpreendente.
          Constraints:
          1. Duração: Mínimo de 30 segundos, máximo de 60 segundos.
          2. Formato: Retorne APENAS a string de início e fim para o Cloudinary. Formato: so_<start_seconds>,eo_<end_seconds>
          3. Exemplos: "so_10,eo_20" ou "so_12.5,eo_45.2"
          4. CRÍTICO: Não use markdown, não use aspas, não explique. Retorne APENAS a string bruta.

          Transcrição:
          ${transcription}
        `;

        const headers = {
          'x-goog-api-key': el.apiKey.value,
          'Content-Type': 'application/json'
        }

        const contents = [{ parts: [{ text: prompt }] }]

        for (let attempt = 1; attempt <= maxRetries; attempt++) {
          app.setStatus('Enviando para análise da IA...');
          try {
            const response = await fetch(endpointGemini, {
              method: 'POST',
              headers: headers,
              body: JSON.stringify({ contents })
            })

            if (!response.ok) {
              throw new Error(`Erro HTTP: ${response.status}`)
            }

            const data = await response.json();
            const rawText = data.candidates[0].content.parts[0].text.trim();
            app.setStatus('IA finalizou a análise.');
            return rawText.replace(/```/g, '').replace(/json/g, "").trim();

          } catch(error) {
            app.setStatus(`Falha ao enviar análise: ${error.message}`);
            if (attempt === maxRetries) {
              throw new Error(`Falha ao conectar com Gemini após ${maxRetries} tentativas.`);
            }
            const delay = baseDelay * Math.pow(2, attempt - 1);
            app.setStatus(`Aguardando ${delay}ms...`);
            await new Promise(resolve => setTimeout(resolve, delay));
          }
        }
      },
      
      finalizeVideo: (viralMoment) => {
          app.setStatus('Montando o clipe final...');
          const viralMomentURL = `https://res.cloudinary.com/${config.cloudName}/video/upload/${viralMoment}/${app.public_id}.mp4`;
          
          el.placeholder.style.display = 'none';
          el.video.style.display = 'block';
          el.video.setAttribute('src', viralMomentURL);
          app.setStatus('Seu clipe viral está pronto!');

          gsap.from(el.video, {
            opacity: 0,
            scale: 0.9,
            duration: 0.8,
            ease: 'power3.out'
          });
      }
    }

    const config = {
      cloudName: 'dhexhadqd',
      uploadPreset: 'upload_hugop_nlw',
      sources: ['local', 'url', 'camera'],
      multiple: false,
      clientAllowedFormats: ['video'],
      language: 'pt',
      text: {
        pt: {
          "or": "Ou",
          "browse": "Procurar",
          "back": "Voltar",
          "advanced": "Avançado",
          "close": "Fechar",
          "keep_scrolling_for_more": "Continue rolando para mais",
          "notifications": {
              "general_error": "Ocorreu um erro.",
              "limit_reached": "Limite de arquivos atingido.",
              "unsupported_file_type": "Tipo de arquivo não suportado."
          },
          "actions": {
            "upload": "Enviar",
            "clear_all": "Limpar tudo",
            "log_out": "Sair"
          },
          "local": {
            "dd_title_single": "Arraste e solte um arquivo aqui",
            "drop_title_single": "Solte um arquivo para enviar",
            "browse": "Procurar"
          }
        }
      }
    }

    const myWidget = cloudinary.createUploadWidget(
      config,
      async (error, result) => {
        if (error) {
          app.setStatus(`Erro no upload: ${error.message}`);
          console.error('Upload Error:', error);
          return;
        }

        if (result && result.event === "success") {
          app.setStatus('Upload concluído com sucesso!');
          el.placeholder.style.display = 'flex';
          el.video.style.display = 'none';

          app.public_id = result.info.public_id;
          
          try {
            const isReady = await app.waitForTranscription();
            if (!isReady) {
              throw new Error('A transcrição falhou ou demorou demais.');
            }

            const viralMoment = await app.getViralMoment();
            if (!viralMoment) {
               throw new Error('Não foi possível determinar o momento viral.');
            }
            
            app.finalizeVideo(viralMoment);

          } catch(err) {
            app.setStatus(`Erro no processo: ${err.message}`);
            console.error(err);
          }
        } else if (result && result.event === "queues-end") {
            // Não faz nada aqui para não sobrescrever o status
        } else if (result && result.event) {
            console.log('Cloudinary Event:', result.event);
        }
      }
    )

    el.button.addEventListener("click", () => {
      if (!el.apiKey.value) {
        alert('Por favor, insira sua chave de API do Gemini primeiro.');
        gsap.fromTo(el.apiKey, { x: -10 }, { x: 10, repeat: 5, yoyo: true, duration: 0.05, clearProps: "x" });
        el.apiKey.focus();
        return;
      }
      myWidget.open();
    }, false);

    // GSAP Animations on Load
    gsap.from("header", { y: -100, opacity: 0, duration: 1, ease: 'power3.out', delay: 0.2 });
    gsap.from("h1, p", { y: 20, opacity: 0, duration: 0.8, ease: 'power3.out', stagger: 0.2, delay: 0.5 });
    gsap.from(".flex.items-center.gap-3", { y: 20, opacity: 0, duration: 0.8, ease: 'power3.out', delay: 1 });
    gsap.from(".aspect-video", { opacity: 0, scale: 0.95, duration: 1, ease: 'power3.out', delay: 1.2 });

    lucide.createIcons();
  </script>
</body>
</html>
